{% extends 'base.html' %}
{% block content %}

<style>
    body {
        background: #000;
        color: #fff;
        font-family: 'Segoe UI', sans-serif;
    }

    .container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 90vh;
    }

    .card {
        width: 400px;
        background: #111;
        padding: 30px;
        border-radius: 12px;
        border: 1px solid #333;
        box-shadow: 0 0 20px rgba(255,255,255,0.05);
    }

    .card h2 {
        text-align: center;
        margin-bottom: 20px;
        font-weight: 500;
    }

    .card input, 
    .card textarea, 
    .card select {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        background: #000;
        border: 1px solid #333;
        border-radius: 6px;
        color: #fff;
        outline: none;
        transition: 0.3s;
    }

    .card input:focus,
    .card textarea:focus,
    .card select:focus {
        border-color: #fff;
        box-shadow: 0 0 5px #fff;
    }

    .card button {
        width: 100%;
        padding: 10px;
        margin-top: 15px;
        border: 1px solid #fff;
        background: #fff;
        color: #000;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.3s;
    }

    .card button:hover {
        background: #000;
        color: #fff;
    }

    /* Hide help text */
    .helptext, ul {
        display: none;
    }

    /* Error styling */
    .errorlist {
        color: #ff4d4d;
        list-style: none;
        padding: 0;
        font-size: 13px;
    }
</style>

<div class="container">
    <div class="card">
        <h2>Add Task</h2>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Add Task</button>
        </form>
    </div>
</div>

{% endblock %}
