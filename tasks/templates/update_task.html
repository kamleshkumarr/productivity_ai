{% extends 'base.html' %}

{% block content %}

<style>
    body {
        background: #000;
        font-family: 'Segoe UI', sans-serif;
        color: #fff;
    }

    .container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 90vh;
    }

    .card {
        background: #111;
        padding: 35px;
        border-radius: 12px;
        width: 350px;
        border: 1px solid #333;
        box-shadow: 0 0 20px rgba(255,255,255,0.05);
    }

    .card h2 {
        text-align: center;
        margin-bottom: 25px;
        font-weight: 500;
        letter-spacing: 1px;
    }

    .card input,
    .card textarea,
    .card select {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #333;
        border-radius: 6px;
        background: #000;
        color: #fff;
        outline: none;
        transition: 0.3s;
    }

    .card input:focus,
    .card textarea:focus,
    .card select:focus {
        border-color: #fff;
        box-shadow: 0 0 5px #fff;
    }

    .card button {
        width: 100%;
        padding: 10px;
        margin-top: 15px;
        border: 1px solid #fff;
        background: #fff;
        color: #000;
        font-weight: bold;
        cursor: pointer;
        border-radius: 6px;
        transition: 0.3s;
    }

    .card button:hover {
        background: #000;
        color: #fff;
    }

    /* Hide Django default help text */
    .helptext, ul {
        display: none;
    }
</style>

<div class="container">
    <div class="card">
        <h2>✏️ Update Task</h2>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Update Task</button>
        </form>
    </div>
</div>

{% endblock %}
